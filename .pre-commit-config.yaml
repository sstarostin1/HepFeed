# Pre-commit hooks: защита от утечки секретов и базовая гигиена файлов.
# Установка: pip install pre-commit && pre-commit install
# Ручной прогон по всем файлам: pre-commit run --all-files

repos:
  # Гигиена файлов: пробелы, переводы строк, валидность YAML/JSON
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files

  # Сканирование секретов (токены, API-ключи) — критично для публичного репозитория
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.3
    hooks:
      - id: gitleaks
